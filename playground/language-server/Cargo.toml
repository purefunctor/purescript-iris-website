[package]
name = "iris-playground-language-server"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
building = { git = "https://github.com/purefunctor/purescript-iris", tag = "v0.1.13" }
files = { git = "https://github.com/purefunctor/purescript-iris", tag = "v0.1.13" }
iris-analysis = { git = "https://github.com/purefunctor/purescript-iris", tag = "v0.1.13" }
javascript = { git = "https://github.com/purefunctor/purescript-iris", tag = "v0.1.13" }
prim-constants = { git = "https://github.com/purefunctor/purescript-iris", tag = "v0.1.13" }
lsp-types = { package = "gen-lsp-types", version = "=0.11.0", features = ["url"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace]
