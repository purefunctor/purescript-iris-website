<!doctype html>
<!--
  Runs a playground program. The page embeds it with sandbox="allow-scripts allow-forms", so it
  has an opaque origin, and public/_headers adds the same sandbox to its response. Its policy below
  blocks network access, and form-action keeps forms, which fire submit events only with
  allow-forms, from submitting; modules arrive from the page as text and load from blob URLs
  through an import map.

  The page compiles a program's StyleX styles and sends their CSS with its modules, and sends the
  site's tokens, base styles and fonts as the frame's theme. Fonts arrive as bytes, which FontFace
  loads without a request, so the policy needs no font source.

  Programs that render, such as Halogen and React applications, mount into #app or anywhere else
  in the body. The first change to the body's content tells the page to show this frame as the
  program's view instead of only its log.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; form-action 'none'; script-src 'unsafe-inline' blob:; style-src 'unsafe-inline'"
    />
    <title>Iris playground program</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        const post = (message) => parent.postMessage(message, "*");
        const moduleURLs = new Map();
        // Error.stack is not source-mapped consistently by browsers. Give the page stable raw
        // generated locations instead; it owns source mapping and can leave FFI frames raw.
        const normalize = (text) => {
          if (!text.includes("blob:")) return text;
          for (const [blob, source] of moduleURLs) text = text.replaceAll(blob, source);
          return text;
        };
        // Output waits until main has returned and the tasks it queued have run, so that a program
        // that prints and then mounts shows as a view at once rather than briefly as a log. React
        // mounts in a MessageChannel task, which runs before the one release() queues after it, and
        // a view takes the held output with it, so the page lays both out together.
        let held = [];
        const send = (message) => {
          if (typeof message.text === "string") message.text = normalize(message.text);
          return held ? held.push(message) : post(message);
        };
        const flush = () => {
          for (const message of held ?? []) post(message);
          held = null;
        };
        const release = () => {
          const channel = new MessageChannel();
          channel.port1.onmessage = () => {
            channel.port1.close();
            flush();
          };
          channel.port2.postMessage(null);
        };
        const format = (value) => {
          if (typeof value === "string") return value;
          if (value instanceof Error) return value.stack || String(value);
          try {
            return JSON.stringify(value) ?? String(value);
          } catch {
            return String(value);
          }
        };
        for (const level of ["log", "info", "warn", "error", "debug"]) {
          console[level] = (...values) => send({ type: "console", level, text: values.map(format).join(" ") });
        }
        addEventListener("error", (event) => send({ type: "error", text: format(event.error ?? event.message) }));
        addEventListener("unhandledrejection", (event) => send({ type: "error", text: format(event.reason) }));

        addEventListener("message", async (event) => {
          if (event.source !== parent || event.data?.type !== "run") return;
          const observer = new MutationObserver(() => {
            observer.disconnect();
            post({ type: "view" });
            flush();
          });
          observer.observe(document.body, { childList: true, subtree: true });
          const { files, entry, css, theme } = event.data;
          for (const text of [theme?.css, css]) {
            if (!text) continue;
            const style = document.createElement("style");
            style.textContent = text;
            document.head.append(style);
          }
          const faces = (theme?.fonts ?? []).map(({ family, data }) => new FontFace(family, data, { weight: "100 900" }));
          for (const face of faces) document.fonts.add(face);
          await Promise.all(faces.map((face) => face.load().catch(() => {})));
          const imports = {};
          for (const [path, text] of Object.entries(files)) {
            const source = `iris-playground:///${path.replace(/^iris-output\//, "").split("/").map(encodeURIComponent).join("/")}`;
            // The final sourceURL wins over an existing compiler/FFI directive. Appending a new
            // line does not move any executable code, so linked maps and raw columns stay valid.
            const blob = URL.createObjectURL(new Blob([text, `\n//# sourceURL=${source}\n`], { type: "text/javascript" }));
            moduleURLs.set(blob, source);
            imports[path] = blob;
          }
          const map = document.createElement("script");
          map.type = "importmap";
          map.textContent = JSON.stringify({ imports });
          document.head.append(map);
          try {
            const module = await import(entry);
            if (typeof module.main !== "function") {
              send({ type: "error", text: "The entry module does not export main." });
            } else {
              module.main();
            }
            send({ type: "done" });
          } catch (error) {
            send({ type: "error", text: format(error) });
          }
          release();
        }, { once: false });

        post({ type: "ready" });
      })();
    </script>
  </body>
</html>
