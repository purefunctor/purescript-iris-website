name: Deploy website

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          path: website
          persist-credentials: false

      - name: Check out Iris compiler
        uses: actions/checkout@v4
        with:
          repository: purefunctor/purescript-iris
          ref: b394e039da11c7fb7efbab8e12c0462bfef86c62
          path: repos/purescript-iris
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: website/.node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install Rust and WASM target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Build static assets
        run: |
          pnpm install --frozen-lockfile
          IRIS_REPOSITORY=../repos/purescript-iris pnpm build

      - name: Deploy static assets
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
