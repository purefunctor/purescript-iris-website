name: Deploy website

on:
  push:
    branches: [main]
  # A push that changes the playground's language server deploys once its canary is published.
  workflow_run:
    workflows: [Playground language server canary]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          # The playground's language server is found by the last commit that changed it.
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install latest stable Iris release
        run: |
          gh attestation verify --help >/dev/null
          IRIS_VERSION=latest IRIS_SKIP_ATTESTATION=0 IRIS_INSTALL_DIR="$RUNNER_TEMP/iris-bin" sh public/install.sh
          echo "$RUNNER_TEMP/iris-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/iris-bin/iris" --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install the playground language server
        id: playground
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          node scripts/download-playground-language-server.mjs --verify || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::notice::The playground language server's canary is not published yet. Its workflow deploys the site once it is."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static assets
        if: steps.playground.outputs.ready == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy static assets
        if: steps.playground.outputs.ready == 'true'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
