name: Deploy website

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install latest stable Iris release
        run: |
          gh attestation verify --help >/dev/null
          IRIS_VERSION=latest IRIS_SKIP_ATTESTATION=0 IRIS_INSTALL_DIR="$RUNNER_TEMP/iris-bin" sh public/install.sh
          echo "$RUNNER_TEMP/iris-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/iris-bin/iris" --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build static assets
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy static assets
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
