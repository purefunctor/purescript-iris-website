name: Deploy website

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned Iris release
        run: |
          archive="$RUNNER_TEMP/iris.tar.gz"
          curl --proto '=https' --tlsv1.2 -fLsS --retry 3 \
            -o "$archive" \
            https://github.com/purefunctor/purescript-iris/releases/download/v0.1.5/iris-x86_64-unknown-linux-musl.tar.gz
          echo "77fdc30148f40eda57b28f669e6350c8241a92337545f9deb8b42cf97ec7fd3f  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" iris-x86_64-unknown-linux-musl/iris
          echo "$RUNNER_TEMP/iris-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/iris-x86_64-unknown-linux-musl/iris" --version

      - name: Build static assets
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy static assets
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
